name: production-soak
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build candidate
        run: CGO_ENABLED=0 go build -trimpath -o .tools/discord-control ./cmd/discord-control
      - name: Run sustained fake-Discord workload
        run: go run ./benchmarks/production -mode soak -duration 15m -binary .tools/discord-control -output production-soak-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: production-soak-evidence
          path: production-soak-evidence.json
          if-no-files-found: error
          retention-days: 30
